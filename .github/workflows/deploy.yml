name: DevOps CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:

  test:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install flask==2.3.3

      - name: Test Flask import
        run: |
          python -c "from flask import Flask; print('Flask import successful')"


  deploy:
    runs-on: ubuntu-latest
    needs: test

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Compress application files
        run: |
          zip -r app.zip .

      - name: Upload application to S3
        run: |
          aws s3 cp app.zip s3://devops-bucket-${{ secrets.AWS_ACCESS_KEY_ID }}/app.zip || true

      - name: Deploy using SSM
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
          --query "Reservations[*].Instances[*].InstanceId" \
          --output text)

          aws ssm send-command \
            --instance-ids $INSTANCE_ID \
            --document-name "AWS-RunShellScript" \
            --parameters commands=["echo Deployment successful"] \
            --region us-east-1
